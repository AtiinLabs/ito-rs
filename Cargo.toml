[package]
name = "ito-rs"
version = "0.7.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"
postcard = { version = "1.1.3", features = ["alloc"] }
serde_bytes = "0.11.19"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
strip = true
overflow-checks = true

[dev-dependencies]
hex = "0.4.3"
serde_json = "1"
